<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#100d20">
  <meta name="description" content="Prep Master by MegaByte is launching soon.">
  <title>Prep Master · Launching Soon</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #100d20; color: #f5f3ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; padding: 24px; background: radial-gradient(ellipse at 18% 12%, #493278 0, transparent 38%), radial-gradient(ellipse at 88% 85%, #242c64 0, transparent 36%), #100d20; }
    body::before, body::after { position: fixed; content: ""; width: 340px; height: 340px; border: 1px solid #c4b5fd18; border-radius: 50%; pointer-events: none; }
    body::before { top: -170px; right: -100px; box-shadow: 0 0 0 36px #c4b5fd08, 0 0 0 72px #c4b5fd06; }
    body::after { bottom: -250px; left: -140px; width: 480px; height: 480px; box-shadow: 0 0 0 42px #c4b5fd08; }
    main { width: min(680px, 100%); position: relative; padding: clamp(32px, 7vw, 68px); border: 1px solid #c4b5fd2b; border-radius: 30px; background: linear-gradient(145deg, #211b38ed, #17152bea); box-shadow: 0 35px 100px #07061199; text-align: center; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: #f5f3ff; font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; text-decoration: none; }
    .brand em { font-style: normal; background: linear-gradient(120deg, #38bdf8, #6366f1 55%, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand-mark { display: inline-flex; width: 38px; height: 38px; overflow: hidden; border-radius: 12px; box-shadow: 0 8px 22px -8px #6366f1e6; animation: logo-breathe 3.4s ease-in-out infinite; }
    .brand-mark b { flex: 1; display: grid; place-items: center; color: #fff; font-size: .9rem; }
    .brand-mark b:first-child { background: #0ea5e9; }
    .brand-mark b:last-child { background: #6366f1; }
    .icon { display: grid; width: 84px; height: 84px; place-items: center; margin: 34px auto 22px; border: 1px solid #c4b5fd38; border-radius: 26px; background: linear-gradient(145deg, #a78bfa27, #6366f124); font-size: 2.3rem; box-shadow: 0 16px 40px #08061366; }
    .badge { display: inline-flex; align-items: center; gap: 9px; padding: 8px 13px; border: 1px solid #c4b5fd42; border-radius: 99px; background: #a78bfa12; color: #d8ccff; font-size: .76rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #c4b5fd; box-shadow: 0 0 12px #c4b5fd; animation: pulse 1.6s ease-in-out infinite; }
    h1 { margin: 22px 0 13px; font-size: clamp(2.8rem, 9vw, 5rem); line-height: .98; letter-spacing: -.07em; }
    h1 span { display: block; color: #c4b5fd; }
    p { max-width: 470px; margin: 0 auto; color: #b8b2cc; font-size: 1.03rem; line-height: 1.75; }
    .tracks { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin: 29px 0 33px; }
    .tracks span { padding: 8px 12px; border: 1px solid #ffffff16; border-radius: 99px; background: #ffffff08; color: #d0cbe0; font-size: .8rem; }
    a.back { display: inline-flex; align-items: center; gap: 8px; padding: 12px 17px; border: 1px solid #c4b5fd5c; border-radius: 12px; color: #f5f3ff; font-weight: 700; text-decoration: none; transition: transform .2s, background .2s; }
    a.back:hover { transform: translateY(-2px); background: #a78bfa1a; }
    @keyframes pulse { 50% { opacity: .4; transform: scale(.8); } }
    @keyframes logo-breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.045); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>

    <div class="icon" aria-hidden="true">🎯</div>
