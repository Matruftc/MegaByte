  <text x="220" y="300" fill="#8b97b8" font-size="15" font-family="Menlo, monospace">main.py</text>
  <rect x="930" y="281" width="84" height="28" rx="7" fill="#ffd43b"/><text x="972" y="301" fill="#1a1400" font-size="15" font-weight="800" text-anchor="middle">▶ Run</text>
  <g font-family="Menlo, monospace" font-size="21">
    <g fill="#4a5576" text-anchor="end"><text x="176" y="366">1</text><text x="176" y="402">2</text><text x="176" y="438">3</text><text x="176" y="474">4</text><text x="176" y="510">5</text><text x="176" y="546">6</text><text x="176" y="582">7</text><text x="176" y="618">8</text></g>
    <text x="206" y="366"><tspan fill="#c792ea">from</tspan><tspan fill="#d6deeb"> collections </tspan><tspan fill="#c792ea">import</tspan><tspan fill="#d6deeb"> Counter</tspan></text>
    <text x="206" y="438"><tspan fill="#c792ea">def</tspan><tspan fill="#82aaff" font-weight="700"> top_words</tspan><tspan fill="#89ddff">(</tspan><tspan fill="#d6deeb">text, n</tspan><tspan fill="#89ddff">=</tspan><tspan fill="#f78c6c">3</tspan><tspan fill="#89ddff">):</tspan></text>
    <text x="250" y="474"><tspan fill="#637099" font-style="italic"># lowercase, split, count</tspan></text>
    <text x="250" y="510"><tspan fill="#c792ea">return</tspan><tspan fill="#ffcb6b"> Counter</tspan><tspan fill="#89ddff">(</tspan><tspan fill="#d6deeb">text.lower().split()</tspan><tspan fill="#89ddff">)</tspan><tspan fill="#d6deeb">.most_common(n)</tspan></text>
    <text x="206" y="582"><tspan fill="#ffcb6b">print</tspan><tspan fill="#89ddff">(</tspan><tspan fill="#d6deeb">top_words</tspan><tspan fill="#89ddff">(</tspan><tspan fill="#c3e88d">"to be or not to be"</tspan><tspan fill="#89ddff">))</tspan></text>
    <rect x="206" y="600" width="3" height="26" fill="#ffd43b"/>
