    <text x="1114" y="404"><tspan fill="#ffcb6b">print</tspan><tspan fill="#89ddff">([</tspan><tspan fill="#d6deeb">f() </tspan><tspan fill="#c792ea">for</tspan><tspan fill="#d6deeb"> f </tspan><tspan fill="#c792ea">in</tspan><tspan fill="#d6deeb"> fns</tspan><tspan fill="#89ddff">])</tspan></text>
