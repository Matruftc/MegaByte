<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Byte emblem">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="200" height="200" rx="56" fill="url(#g)"/>
  <!-- 8 bits of a byte: 0100 0010 = "B" -->
  <g font-family="SF Mono, Menlo, monospace" font-size="13" font-weight="700" fill="#fff" fill-opacity=".35" text-anchor="middle">
    <text x="30" y="30">0</text><text x="50" y="30">1</text><text x="70" y="30">0</text><text x="90" y="30">0</text>
    <text x="110" y="30">0</text><text x="130" y="30">0</text><text x="150" y="30">1</text><text x="170" y="30">0</text>
  </g>
  <g fill="#fff">
    <rect x="68" y="52" width="16" height="16" rx="3"/><rect x="88" y="52" width="16" height="16" rx="3"/><rect x="108" y="52" width="16" height="16" rx="3"/>
    <rect x="68" y="72" width="16" height="16" rx="3"/><rect x="128" y="72" width="16" height="16" rx="3"/>
    <rect x="68" y="92" width="16" height="16" rx="3"/><rect x="88" y="92" width="16" height="16" rx="3"/><rect x="108" y="92" width="16" height="16" rx="3"/>
    <rect x="68" y="112" width="16" height="16" rx="3"/><rect x="128" y="112" width="16" height="16" rx="3"/>
    <rect x="68" y="132" width="16" height="16" rx="3"/><rect x="88" y="132" width="16" height="16" rx="3"/><rect x="108" y="132" width="16" height="16" rx="3"/>
    
  </g>
  <text x="100" y="188" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" font-weight="800" letter-spacing="5" fill="#fff" fill-opacity=".85">BYTE</text>
</svg>
