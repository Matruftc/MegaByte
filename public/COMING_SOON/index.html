<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080f20">
  <meta name="description" content="A new MegaByte Academy is launching soon.">
  <title>Academy · Launching Soon · MegaByte</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080f20; color: #edf4ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; padding: 24px; background: radial-gradient(ellipse at 16% 12%, #164166 0, transparent 38%), radial-gradient(ellipse at 88% 85%, #34286b 0, transparent 36%), #080f20; }
    body::before, body::after { position: fixed; content: ""; width: 340px; height: 340px; border: 1px solid #7dd3fc18; border-radius: 50%; pointer-events: none; }
    body::before { top: -170px; right: -100px; box-shadow: 0 0 0 36px #7dd3fc08, 0 0 0 72px #7dd3fc06; }
    body::after { bottom: -250px; left: -140px; width: 480px; height: 480px; box-shadow: 0 0 0 42px #7dd3fc08; }
    main { width: min(700px, 100%); position: relative; padding: clamp(32px, 7vw, 68px); border: 1px solid #7dd3fc2c; border-radius: 30px; background: linear-gradient(145deg, #18253ced, #13182bea); box-shadow: 0 35px 100px #04091599; text-align: center; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: #f5f3ff; font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; text-decoration: none; }
    .brand em { font-style: normal; background: linear-gradient(120deg, #38bdf8, #6366f1 55%, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand-mark { display: inline-flex; width: 38px; height: 38px; overflow: hidden; border-radius: 12px; box-shadow: 0 8px 22px -8px #6366f1e6; animation: logo-breathe 3.4s ease-in-out infinite; }
    .brand-mark b { flex: 1; display: grid; place-items: center; color: #fff; font-size: .9rem; }
    .brand-mark b:first-child { background: #0ea5e9; }.brand-mark b:last-child { background: #6366f1; }
    .icon { display: grid; width: 84px; height: 84px; place-items: center; margin: 34px auto 22px; border: 1px solid #7dd3fc38; border-radius: 26px; background: linear-gradient(145deg, #38bdf827, #818cf824); font-size: 2.3rem; box-shadow: 0 16px 40px #08061366; }
    .badge { display: inline-flex; align-items: center; gap: 9px; padding: 8px 13px; border: 1px solid #7dd3fc42; border-radius: 99px; background: #38bdf812; color: #c4e7ff; font-size: .76rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #7dd3fc; box-shadow: 0 0 12px #7dd3fc; animation: pulse 1.6s ease-in-out infinite; }
    h1 { margin: 22px 0 13px; font-size: clamp(2.65rem, 8vw, 4.65rem); line-height: 1; letter-spacing: -.065em; }
    h1 span { display: block; margin-top: 8px; color: #93c5fd; }
    p { max-width: 500px; margin: 0 auto; color: #b5c2d7; font-size: 1.03rem; line-height: 1.75; }
    .topics { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin: 29px 0 33px; }
    .topics span { padding: 8px 12px; border: 1px solid #ffffff16; border-radius: 99px; background: #ffffff08; color: #d0dced; font-size: .8rem; }
    a.back { display: inline-flex; align-items: center; gap: 8px; padding: 12px 17px; border: 1px solid #7dd3fc5c; border-radius: 12px; color: #f5f3ff; font-weight: 700; text-decoration: none; transition: transform .2s, background .2s; }
    a.back:hover { transform: translateY(-2px); background: #38bdf81a; }
    @keyframes pulse { 50% { opacity: .4; transform: scale(.8); } }
    @keyframes logo-breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.045); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="../index.html" aria-label="MegaByte home"><span class="brand-mark" aria-hidden="true"><b>M</b><b>B</b></span><span>Mega<em>Byte</em></span></a>
    <div class="icon" id="academyIcon" aria-hidden="true">☁️</div>
    <span class="badge"><i class="dot" aria-hidden="true"></i> Coming soon</span>
    <h1 id="academyName">Academy <span>Launching Soon</span></h1>
    <p id="academyDescription">We’re preparing a new hands-on learning experience. Check back soon for more.</p>
    <div class="topics" id="academyTopics" aria-label="Planned learning areas"></div>
    <a class="back" href="../index.html">← Back to MegaByte</a>
  </main>
  <script>
    const academies = {
      aws: { name: "AWS Academy", icon: "☁️", description: "Build your cloud foundations with guided AWS concepts and practical learning. This academy is in the works.", topics: ["Cloud foundations", "AWS services", "Security & IAM"] },
      "etl-elt": { name: "ETL/ELT Academy", icon: "🔄", description: "Explore how data moves, transforms and reaches the systems that use it. A practical data pipeline learning experience is on the way.", topics: ["ETL & ELT", "Data pipelines", "Quality & orchestration"] },
      "software-engineering": { name: "Software Engineering Academy", icon: "🛠️", description: "Learn the foundations of designing, building, testing and shipping reliable software. This hands-on academy is in development.", topics: ["Software design", "Development practices", "Testing & delivery"] }
    };
    const academy = academies[new URLSearchParams(location.search).get("project")] || academies.aws;
    document.title = `${academy.name} · Launching Soon · MegaByte`;
    document.querySelector("#academyIcon").textContent = academy.icon;
    document.querySelector("#academyName").innerHTML = `${academy.name}<span>Launching Soon</span>`;
    document.querySelector("#academyDescription").textContent = academy.description;
    document.querySelector("#academyTopics").innerHTML = academy.topics.map(topic => `<span>${topic}</span>`).join("");
  </script>
</body>
</html>
